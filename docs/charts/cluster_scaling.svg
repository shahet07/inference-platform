<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Cluster: throughput relative to one node">

<style>
  :root { --surface:#fcfcfb; --text:#0b0b0b; --muted:#52514e; --grid:#e4e3df; --ideal:#8a8983;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --text:#f0efec; --muted:#c3c2b7; --grid:#3a3a37; --ideal:#8a8983;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
  .title { font-size: 16px; font-weight: 600; fill: var(--text); }
  .label { fill: var(--text); }
  .hit { fill: transparent; }
</style>

<rect width="720" height="400" fill="var(--surface)"/>
<text class="title" x="64" y="28">Cluster: throughput relative to one node</text>
<line x1="64" x2="570" y1="344.0" y2="344.0" stroke="var(--grid)"/>
<text x="54" y="348.0" text-anchor="end">0.0x</text>
<line x1="64" x2="570" y1="272.0" y2="272.0" stroke="var(--grid)"/>
<text x="54" y="276.0" text-anchor="end">1.0x</text>
<line x1="64" x2="570" y1="200.0" y2="200.0" stroke="var(--grid)"/>
<text x="54" y="204.0" text-anchor="end">2.0x</text>
<line x1="64" x2="570" y1="128.0" y2="128.0" stroke="var(--grid)"/>
<text x="54" y="132.0" text-anchor="end">3.0x</text>
<line x1="64" x2="570" y1="56.0" y2="56.0" stroke="var(--grid)"/>
<text x="54" y="60.0" text-anchor="end">4.0x</text>
<text x="64.0" y="366" text-anchor="middle">1</text>
<text x="232.7" y="366" text-anchor="middle">2</text>
<text x="401.3" y="366" text-anchor="middle">3</text>
<text x="570.0" y="366" text-anchor="middle">4</text>
<text x="317.0" y="388" text-anchor="middle">Nodes behind the router, on one machine</text>
<text x="64" y="46">Throughput vs 1 node</text>
<polyline points="64.0,272.0 232.7,200.0 401.3,128.0 570.0,56.0" fill="none" stroke="var(--ideal)" stroke-width="2" stroke-dasharray="4 5"/>
<text x="580.0" y="60.0">ideal</text>
<polyline points="64.0,272.0 232.7,210.9 401.3,196.0 570.0,184.2" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
<g><title>XL model, 1: 1.0x</title><circle class="hit" cx="64.0" cy="272.0" r="14"/><circle cx="64.0" cy="272.0" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>XL model, 2: 1.8x</title><circle class="hit" cx="232.7" cy="210.9" r="14"/><circle cx="232.7" cy="210.9" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>XL model, 3: 2.1x</title><circle class="hit" cx="401.3" cy="196.0" r="14"/><circle cx="401.3" cy="196.0" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>XL model, 4: 2.2x</title><circle class="hit" cx="570.0" cy="184.2" r="14"/><circle cx="570.0" cy="184.2" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
<text class="label" x="580.0" y="188.2">XL model 2.2x</text>
<polyline points="64.0,272.0 232.7,206.9 401.3,192.4 570.0,186.9" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>
<g><title>Heavy model, 1: 1.0x</title><circle class="hit" cx="64.0" cy="272.0" r="14"/><circle cx="64.0" cy="272.0" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>Heavy model, 2: 1.9x</title><circle class="hit" cx="232.7" cy="206.9" r="14"/><circle cx="232.7" cy="206.9" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>Heavy model, 3: 2.1x</title><circle class="hit" cx="401.3" cy="192.4" r="14"/><circle cx="401.3" cy="192.4" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>Heavy model, 4: 2.2x</title><circle class="hit" cx="570.0" cy="186.9" r="14"/><circle cx="570.0" cy="186.9" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/></g>
<text class="label" x="580.0" y="206.2">Heavy model 2.2x</text>
<polyline points="64.0,272.0 232.7,268.7 401.3,267.7 570.0,267.9" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round"/>
<g><title>Light model, 1: 1.0x</title><circle class="hit" cx="64.0" cy="272.0" r="14"/><circle cx="64.0" cy="272.0" r="4.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>Light model, 2: 1.0x</title><circle class="hit" cx="232.7" cy="268.7" r="14"/><circle cx="232.7" cy="268.7" r="4.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>Light model, 3: 1.1x</title><circle class="hit" cx="401.3" cy="267.7" r="14"/><circle cx="401.3" cy="267.7" r="4.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>Light model, 4: 1.1x</title><circle class="hit" cx="570.0" cy="267.9" r="14"/><circle cx="570.0" cy="267.9" r="4.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/></g>
<text class="label" x="580.0" y="271.9">Light model 1.1x</text>
</svg>
