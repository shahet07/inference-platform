<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Single server: p99 latency by worker threads">

<style>
  :root { --surface:#fcfcfb; --text:#0b0b0b; --muted:#52514e; --grid:#e4e3df; --ideal:#8a8983;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --text:#f0efec; --muted:#c3c2b7; --grid:#3a3a37; --ideal:#8a8983;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
  }
  text { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
  .title { font-size: 16px; font-weight: 600; fill: var(--text); }
  .label { fill: var(--text); }
  .hit { fill: transparent; }
</style>

<rect width="720" height="400" fill="var(--surface)"/>
<text class="title" x="64" y="28">Single server: p99 latency by worker threads</text>
<line x1="64" x2="570" y1="344.0" y2="344.0" stroke="var(--grid)"/>
<text x="54" y="348.0" text-anchor="end">0.0</text>
<line x1="64" x2="570" y1="272.0" y2="272.0" stroke="var(--grid)"/>
<text x="54" y="276.0" text-anchor="end">2.0</text>
<line x1="64" x2="570" y1="200.0" y2="200.0" stroke="var(--grid)"/>
<text x="54" y="204.0" text-anchor="end">4.0</text>
<line x1="64" x2="570" y1="128.0" y2="128.0" stroke="var(--grid)"/>
<text x="54" y="132.0" text-anchor="end">6.0</text>
<line x1="64" x2="570" y1="56.0" y2="56.0" stroke="var(--grid)"/>
<text x="54" y="60.0" text-anchor="end">8.0</text>
<text x="64.0" y="366" text-anchor="middle">1</text>
<text x="165.2" y="366" text-anchor="middle">4</text>
<text x="300.1" y="366" text-anchor="middle">8</text>
<text x="570.0" y="366" text-anchor="middle">16</text>
<text x="317.0" y="388" text-anchor="middle">Worker threads</text>
<text x="64" y="46">p99 latency, ms</text>
<polyline points="64.0,162.5 165.2,98.8 300.1,135.2 570.0,110.9" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
<g><title>p99, 1: 5.0</title><circle class="hit" cx="64.0" cy="162.5" r="14"/><circle cx="64.0" cy="162.5" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>p99, 4: 6.8</title><circle class="hit" cx="165.2" cy="98.8" r="14"/><circle cx="165.2" cy="98.8" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>p99, 8: 5.8</title><circle class="hit" cx="300.1" cy="135.2" r="14"/><circle cx="300.1" cy="135.2" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
<g><title>p99, 16: 6.5</title><circle class="hit" cx="570.0" cy="110.9" r="14"/><circle cx="570.0" cy="110.9" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></g>
<text class="label" x="580.0" y="114.9">p99 6.5</text>
</svg>
