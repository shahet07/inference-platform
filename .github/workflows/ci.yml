name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan, tsan]
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --timeout 180

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release --timeout 180

  fuzz:
    runs-on: ubuntu-24.04
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-dev
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz --target fuzz_traceparent fuzz_escape fuzz_registry fuzz_window fuzz_wal fuzz_join fuzz_sliding fuzz_raft_log fuzz_http_parser
      - run: python3 tools/run_fuzzers.py --seconds 30
